name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish (vX.Y.Z, must match package.json and be on main)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate the OIDC publish behind an environment (reviewers and tag rules live in GitHub settings).
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Only publish a release tag that matches package.json and is on main
        env:
          REF: ${{ github.event.inputs.ref }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${REF#refs/tags/}" != "$tag" ]; then
            echo "Publish the tag $tag, not '$REF'." >&2
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "The checkout does not match tag $tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $tag is not on main." >&2
            exit 1
          fi

      - name: Use npm 11.5.1 for trusted publishing
        run: npm install -g npm@11.5.1

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - run: npx tsc --noEmit

      - run: npm run test:browser

      - run: npm run test:release

      - run: npm publish --access public
